<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кот Строитель</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0; padding: 0;
            background: #1a1a1a;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
            user-select: none; font-family: sans-serif;
        }

        .game-box {
            width: 1024px; height: 600px;
            position: relative;
            background: #b3d4f0; border: 4px solid #111;
            overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        @media only screen and (max-width: 1024px) {
            .game-box { width: 100vw; height: 100vh; border: none; box-shadow: none; }
        }

        /* КНОПКИ В ПРАВОМ ВЕРХНЕМ УГЛУ */
        .top-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: sans-serif;
            border: none;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .top-btn:active { transform: scale(0.95); }

        #fullscreenBtn {
            right: 140px;
            background: #2ecc71;
            color: #fff;
        }
        #fullscreenBtn:hover { background: #27ae60; }

        #installBtn {
            background: #3498db;
            color: #fff;
        }
        #installBtn:hover { background: #2980b9; }

        @media (max-width: 600px) {
            .top-btn { font-size: 12px; padding: 6px 10px; top: 10px; }
            #fullscreenBtn { right: 80px; }
        }

        #mainWorld {
            position: absolute; inset: 0; z-index: 10;
            background-image: radial-gradient(circle at 50% 0%, #fff 20%, #b3d4f0 80%);
            transition: opacity 0.3s;
        }
        #mainWorld.hidden { opacity: 0; pointer-events: none; }

        .ground-main {
            position: absolute; bottom: 0; width: 100%; height: 180px;
            background: #4a5d4a; border-top: 3px solid #222;
            background-image: repeating-linear-gradient(-45deg, #2b3a2b 0px, #2b3a2b 4px, #5a6d5a 4px, #5a6d5a 8px);
        }

        .hint-main {
            position: absolute; top: 5%; width: 100%; text-align: center;
            font-size: 24px; font-weight: bold; color: #222;
            pointer-events: none; padding: 0 10px;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .cloud { position: absolute; background: #fff; border: 2px solid #ccc; }
        .cloud::before { content: ''; position: absolute; background: #fff; border: 2px solid #ccc; }
        .c1 { top: 10%; left: 8%; width: 120px; height: 40px; }
        .c1::before { top: -30px; left: 20px; width: 60px; height: 50px; border-radius: 50% 50% 0 0; }
        .c2 { top: 18%; left: 45%; width: 100px; height: 30px; }
        .c2::before { top: -25px; left: 15px; width: 50px; height: 40px; border-radius: 50% 50% 0 0; }
        .c3 { top: 15%; right: 10%; width: 120px; height: 40px; }
        .c3::before { top: -30px; left: 20px; width: 60px; height: 50px; border-radius: 50% 50% 0 0; }

        .tree { position: absolute; bottom: 180px; right: 250px; }
        .tree-trunk { width: 30px; height: 120px; background: #6b4c2a; border: 3px solid #4a341c; margin: 0 auto; }
        .tree-leaves { width: 90px; height: 70px; background: #2d6a2d; border: 3px solid #1f4a1f; }

        .workbench {
            position: absolute; bottom: 180px; left: 450px;
            width: 70px; height: 70px;
            background: #8b5a2b; border: 3px solid #5a3a1b; z-index: 15; cursor: pointer;
        }
        .workbench::before, .workbench::after {
            content: ''; position: absolute; top: 5px; left: 31px;
            width: 4px; height: 60px; background: #3b2a1b;
        }
        .workbench::before { transform: rotate(45deg); }
        .workbench::after { transform: rotate(-45deg); }
        .workbench:active { transform: scale(0.95); }
        
        .workbench-label {
            position: absolute; top: -40px; left: -15px; width: 100px;
            text-align: center; color: #fff; background: #222;
            padding: 5px; border-radius: 5px; font-weight: bold; border: 1px solid gold;
            pointer-events: none; font-size: 14px;
        }

        .cat-main {
            position: absolute; bottom: 180px; left: 250px;
            width: 50px; height: 50px;
            background: #fff; border: 3px solid #222;
        }
        .cat-main::after { content: 'UωU'; position: absolute; top: 5px; left: 12px; font-size: 20px; font-weight: bold; }

        #miniGame {
            position: absolute; inset: 0; z-index: 20;
            display: none; background: #1a2a3a;
            cursor: crosshair;
        }

        #ui {
            position: absolute; top: 15px; left: 20px;
            color: #fff; font-size: 22px; font-weight: bold; z-index: 30; pointer-events: none;
            text-shadow: 2px 2px 0 #000; display: flex; gap: 20px;
        }
        .life-icon { color: #ff4444; transition: all 0.1s; }
        .life-icon.damage { color: #ff0000; transform: scale(1.3); }

        #gameCat {
            position: absolute; bottom: 40px; left: 480px; width: 55px; height: 55px;
            background: #fff; border: 4px solid #222; z-index: 5;
        }
        #gameCat::after { content: 'O_O'; position: absolute; top: 5px; left: 12px; font-size: 22px; font-weight: bold; }

        .ground-game {
            position: absolute; bottom: 0; width: 100%; height: 40px; background: #2c3e50; border-top: 5px solid #1a252f;
        }

        .enemy {
            position: absolute; width: 35px; height: 35px; background: #e74c3c; border: 2px solid #c0392b; z-index: 4;
            box-shadow: 0 3px 0 #922b21; cursor: pointer;
        }
        .enemy::after { content: '😈'; position: absolute; top: 0px; left: 6px; font-size: 22px; }
        .enemy.blue { background: #3498db; border-color: #2980b9; box-shadow: 0 3px 0 #1f618d; }
        .enemy.blue::after { content: '👾'; }
        .enemy.green { background: #2ecc71; border-color: #27ae60; box-shadow: 0 3px 0 #1e8449; }
        .enemy.green::after { content: '🐉'; }

        #gameOverScreen {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 50; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
        }
        #gameOverText { color: #ff4444; font-size: 50px; font-weight: bold; text-shadow: 5px 5px 0 #000; text-align: center; }
        #respawnBtn {
            padding: 15px 40px; font-size: 28px; font-weight: bold;
            background: #2ecc71; color: #fff; border: none; border-radius: 15px; cursor: pointer;
            box-shadow: 0 5px 0 #1e8449;
        }

        #exitPhoneBtn {
            position: absolute; top: 15px; right: 15px;
            background: #e74c3c; color: #fff; border: none; padding: 8px 18px;
            border-radius: 10px; font-size: 18px; font-weight: bold; z-index: 30; cursor: pointer;
            box-shadow: 0 3px 0 #922b21; display: none;
        }
    </style>
</head>
<body>

<div class="game-box" id="gameWrapper">
    
    <!-- КНОПКИ В ПРАВОМ УГЛУ -->
    <button class="top-btn" id="fullscreenBtn">⛶ На весь экран</button>
    <button class="top-btn" id="installBtn">📲 PWA</button>

    <div id="mainWorld">
        <div class="hint-main" id="hintText">Нажми на <b>Верстак</b> (или нажми E)</div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="tree"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
        <div class="workbench" id="workbenchBtn">
            <div class="workbench-label">Играть!</div>
        </div>
        <div class="cat-main"></div>
        <div class="ground-main"></div>
    </div>

    <div id="miniGame">
        <div id="ui">
            <span>⚔️ Счёт: <span id="score">0</span></span>
            <span class="life-icon" id="lifeIcon">❤️ <span id="lives">3</span></span>
        </div>
        
        <button id="exitPhoneBtn">Выйти</button>
        
        <div id="gameOverScreen">
            <div id="gameOverText">Верстак уничтожен!<br><span style="font-size: 24px; color: #fff;">Кот Строитель устал...</span></div>
            <button id="respawnBtn">🔄 Респавн</button>
        </div>
        
        <div class="ground-game"></div>
        <div id="gameCat"></div>
    </div>

</div>

<script>
    // --- КНОПКА PWA ---
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.textContent = '✅ Установлено';
                    installBtn.style.background = '#27ae60';
                    installBtn.disabled = true;
                }
                deferredPrompt = null;
            }
        });
    });

    // --- КНОПКА ВО ВЕСЬ ЭКРАН ---
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    
    fullscreenBtn.addEventListener('click', () => {
        const elem = document.getElementById('gameWrapper');
        if (!document.fullscreenElement) {
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    });

    // --- ОПРЕДЕЛЕНИЕ ТЕЛЕФОНА ---
    const isPhone = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    // --- ЭЛЕМЕНТЫ ---
    const mainWorld = document.getElementById('mainWorld');
    const miniGame = document.getElementById('miniGame');
    const hintText = document.getElementById('hintText');
    const workbenchBtn = document.getElementById('workbenchBtn');
    const exitPhoneBtn = document.getElementById('exitPhoneBtn');
    const scoreSpan = document.getElementById('score');
    const livesSpan = document.getElementById('lives');
    const lifeIcon = document.getElementById('lifeIcon');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const respawnBtn = document.getElementById('respawnBtn');

    if (isPhone) {
        exitPhoneBtn.style.display = 'block';
        hintText.innerHTML = "Нажми на <b>Верстак</b> пальцем";
    } else {
        exitPhoneBtn.style.display = 'none';
        hintText.innerHTML = "Нажми на <b>Верстак</b> (или нажми E)";
    }

    let isActive = false;
    let score = 0;
    let lives = 3;
    let enemies = [];
    let gameLoop = null;
    let spawnLoop = null;

    document.addEventListener('keydown', (e) => {
        if (e.key === 'e' || e.key === 'E') {
            e.preventDefault();
            if (!isActive) { startGame(); } else { stopGame(); }
            return;
        }
    });

    function startGame() {
        mainWorld.classList.add('hidden');
        miniGame.style.display = 'block';
        isActive = true;
        score = 0; lives = 3;
        scoreSpan.textContent = score;
        livesSpan.textContent = lives;
        lifeIcon.classList.remove('damage');
        gameOverScreen.style.display = 'none';
        enemies.forEach(e => e.remove());
        enemies = [];
        startLoops();
    }

    function stopGame() {
        isActive = false;
        clearInterval(gameLoop);
        clearInterval(spawnLoop);
        mainWorld.classList.remove('hidden');
        miniGame.style.display = 'none';
    }

    workbenchBtn.addEventListener('click', startGame);
    exitPhoneBtn.addEventListener('click', stopGame);
    respawnBtn.addEventListener('click', startGame);

    function startLoops() {
        // Интервал появления: 1500 мс (2 врага за 3 секунды)
        spawnLoop = setInterval(() => {
            if(!isActive) return;
            if(lives <= 0) return;
            
            const e = document.createElement('div');
            e.classList.add('enemy');
            const r = Math.random();
            if(r > 0.7) e.classList.add('blue');
            else if(r > 0.4) e.classList.add('green');
            e.style.left = Math.random() * 980 + 'px';
            e.style.top = '-40px';
            miniGame.appendChild(e);
            enemies.push(e);

            e.addEventListener('click', function(ev) {
                ev.stopPropagation();
                if(!isActive || lives <= 0) return;
                
                this.remove();
                const idx = enemies.indexOf(this);
                if(idx > -1) enemies.splice(idx, 1);
                
                score += 10;
                scoreSpan.textContent = score;
            });
        }, 1500);

        gameLoop = setInterval(() => {
            if(!isActive) return;
            if(lives <= 0) {
                gameOverScreen.style.display = 'flex';
                isActive = false;
                clearInterval(gameLoop);
                clearInterval(spawnLoop);
                return;
            }

            for(let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                let top = parseInt(e.style.top);
                top += 2; // Скорость падения
                e.style.top = top + 'px';

                if(top > 560) {
                    e.remove();
                    enemies.splice(i, 1);
                    lives--;
                    livesSpan.textContent = lives;
                    lifeIcon.classList.add('damage');
                    setTimeout(() => lifeIcon.classList.remove('damage'), 200);

                    if(lives <= 0) {
                        gameOverScreen.style.display = 'flex';
                        isActive = false;
                        clearInterval(gameLoop);
                        clearInterval(spawnLoop);
                        return;
                    }
                }
            }
        }, 25);
    }
</script>

</body>
</html>
